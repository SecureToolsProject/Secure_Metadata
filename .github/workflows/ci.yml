name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Fuzz smoke
        run: npm run fuzz:smoke

      - name: Build
        run: npm run build

      - name: Browser smoke
        run: npm run browser:smoke

      - name: Audit package payload
        run: npm run package:audit

      - name: Audit licenses
        run: npm run license:audit

      - name: Audit vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify version consistency
        run: npm run version:check

      - name: Verify reproducible artifacts
        run: npm run release:repro

      - name: Verify release hashes
        run: npm run release:verify
